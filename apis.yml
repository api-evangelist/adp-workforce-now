aid: adp-workforce-now
name: ADP Workforce Now
description: >-
  ADP Workforce Now is ADP's cloud-based human capital management (HCM) suite
  for mid-sized businesses, covering payroll, HR, benefits administration, time
  and attendance, talent management, and analytics in a single platform. The
  product offers tax filing, compliance reporting, mobile self-service, and
  marketplace integrations through ADP's developer ecosystem. The ADP Workforce
  Now APIs (HCM v2) use OAuth 2.0 / OpenID Connect with mutual TLS client
  certificates and expose worker, payroll, time, benefits, and talent data
  through ADP API Central.
