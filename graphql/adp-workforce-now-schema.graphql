# ─── Root Types ──────────────────────────────────────────────────────────────

type Query {
  worker(workerID: ID!): Worker
  workers(
    statusCode: WorkerStatusCode
    departmentID: ID
    locationID: ID
    first: Int
    after: String
  ): WorkerConnection

  assignment(assignmentID: ID!): Assignment
  payrollRun(payrollRunID: ID!): PayrollRun
  payrollRuns(
    payPeriodStartDate: Date
    payPeriodEndDate: Date
    first: Int
  ): [PayrollRun]

  timeCard(timeCardID: ID!): TimeCard
  leaveRequest(leaveRequestID: ID!): LeaveRequest
  leaveRequests(workerID: ID, statusCode: String): [LeaveRequest]

  benefit(benefitID: ID!): Benefit
  benefitPlan(planID: ID!): BenefitPlan
  benefitPlans(planTypeCode: String): [BenefitPlan]

  performanceReview(reviewID: ID!): PerformanceReview
  performanceReviews(workerID: ID, statusCode: String): [PerformanceReview]

  organization(organizationID: ID!): Organization
  department(departmentID: ID!): Department
  departments(organizationID: ID): [Department]
  position(positionID: ID!): Position
  positions(departmentID: ID, activeOnly: Boolean): [Position]
  location(locationID: ID!): Location
  locations: [Location]
  job(jobID: ID!): Job
  jobs(activeOnly: Boolean): [Job]
  team(teamID: ID!): Team
  teams(organizationID: ID): [Team]

  earningCodes(activeOnly: Boolean): [EarningCode]
  deductionCodes(activeOnly: Boolean): [DeductionCode]
  learningCourses(mandatoryOnly: Boolean): [LearningCourse]
  webhookSubscriptions: [Subscription]
}

type Mutation {
  createLeaveRequest(
    workerID: ID!
    leaveType: LeaveTypeCode!
    startDate: Date!
    endDate: Date!
    notes: String
  ): LeaveRequest

  updateLeaveRequest(
    leaveRequestID: ID!
    statusCode: String!
    approvedStartDate: Date
    approvedEndDate: Date
    notes: String
  ): LeaveRequest

  submitTimeCard(timeCardID: ID!): TimeCard

  createTimeEntry(
    workerID: ID!
    entryDate: Date!
    startTime: DateTime
    stopTime: DateTime
    earningCode: String
    notes: String
  ): TimeEntry

  updateBenefitElection(
    workerID: ID!
    planID: ID!
    coverageLevelCode: String!
    waiveIndicator: Boolean
  ): BenefitElection

  createGoal(
    workerID: ID!
    goalName: String!
    description: String
    targetDate: Date
    weightPercent: Decimal
  ): Goal

  updateGoal(
    goalID: ID!
    goalStatus: GoalStatusCode
    progressPercent: Decimal
    completedDate: Date
    notes: String
  ): Goal

  createWebhookSubscription(
    subscriberName: String!
    callbackURL: String!
    eventTypes: [WebhookEventTypeCode!]!
    secretKey: String
  ): Subscription

  deleteWebhookSubscription(subscriptionID: ID!): Boolean

  createDirectDeposit(
    workerID: ID!
    priority: Int!
    bankRoutingTransitNumber: String!
    bankAccountNumber: String!
    bankAccountTypeCode: String!
    depositAmount: Decimal
    depositPercent: Decimal
    remainderIndicator: Boolean
  ): DirectDeposit

  updateTaxWithholding(
    workerID: ID!
    taxTypeCode: String!
    jurisdictionCode: String!
    filingStatusCode: String
    allowances: Int
    additionalAmount: Decimal
    exemptIndicator: Boolean
  ): TaxWithholding
}
