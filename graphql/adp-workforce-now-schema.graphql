"""
ADP Workforce Now HCM GraphQL Schema
Conceptual schema derived from the ADP Workforce Now HCM v2 REST API.
Authentication: OAuth 2.0 (client credentials) with mutual TLS.
Base URL: https://api.adp.com
"""

# ─── Scalars ────────────────────────────────────────────────────────────────

scalar Date
scalar DateTime
scalar Decimal

# ─── Enums ──────────────────────────────────────────────────────────────────

enum WorkerStatusCode {
  ACTIVE
  INACTIVE
  TERMINATED
  LEAVE
  SUSPENDED
}

enum WorkerTypeCode {
  EMPLOYEE
  CONTRACTOR
  TEMPORARY
  PART_TIME
  FULL_TIME
  INTERN
}

enum AssignmentStatusCode {
  ACTIVE
  INACTIVE
  PENDING
  ENDED
}

enum PayFrequencyCode {
  WEEKLY
  BIWEEKLY
  SEMIMONTHLY
  MONTHLY
  ANNUAL
}

enum GoalStatusCode {
  NOT_STARTED
  IN_PROGRESS
  COMPLETED
  CANCELLED
  ON_HOLD
}

enum CompetencyRatingCode {
  EXCEEDS_EXPECTATIONS
  MEETS_EXPECTATIONS
  BELOW_EXPECTATIONS
  NOT_RATED
}

enum LeaveTypeCode {
  VACATION
  SICK
  PERSONAL
  FMLA
  MATERNITY
  PATERNITY
  BEREAVEMENT
  MILITARY
  JURY_DUTY
  OTHER
}

enum WebhookEventTypeCode {
  WORKER_HIRE
  WORKER_TERMINATE
  WORKER_TRANSFER
  PAYROLL_RUN_COMPLETE
  BENEFIT_ELECTION_CHANGE
  TIME_ENTRY_SUBMITTED
  LEAVE_REQUEST_APPROVED
}

# ─── Core Worker Types ───────────────────────────────────────────────────────

type Worker {
  workerID: ID!
